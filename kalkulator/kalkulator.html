<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalkulator Nilai Siswa</title>

    <link rel="stylesheet" href="kalkulator.css">
</head>

<body>
    
    <div class="container">

        <div class="header">
            <h2>Kalkulator Nilai Siswa</h2>
            <p>Hitung rata-rata dan predikat nilai kamu</p>
        </div>
    
        <label>Nilai Tugas</label>
        <input type="number" id="tugas" 
        placeholder="Masukkan nilai Tugas">

        <label>Nilai UTS</label>
        <input type="number" id="uts"
        placeholder="Masukkan nilai UTS">

        <label>Nilai UAS</label>
        <input type="number" id="uas"
        placeholder="Masukkan nilai UAS">

        <button onclick="hitungNilai()">
            Hitung Nilai
        </button>

        <div class="hasil">
            <h3>Hasil Perhitungan</h3>
            <p id="hasil">
                Hasil nilai akan muncul di sini.
            </p>
        </div>

    </div>

    <script src="kalkulator.js"></script>

</body>
</html>
